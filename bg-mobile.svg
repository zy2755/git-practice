<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid slice">
	<!-- 手机端壁纸（竖版 9:16）：极浅雾蓝白渐变 + 顶部一团柔和光晕 -->
	<defs>
		<linearGradient id="skyML" x1="0" y1="0" x2="0.6" y2="1">
			<stop offset="0%" stop-color="#fafcfe"/>
			<stop offset="60%" stop-color="#f4f8fb"/>
			<stop offset="100%" stop-color="#edf2f8"/>
		</linearGradient>
		<radialGradient id="glowML" cx="0.5" cy="0.10" r="0.68">
			<stop offset="0%" stop-color="#5b8cc7" stop-opacity="0.11"/>
			<stop offset="70%" stop-color="#5b8cc7" stop-opacity="0.03"/>
			<stop offset="100%" stop-color="#5b8cc7" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="720" height="1280" fill="url(#skyML)"/>
	<rect width="720" height="1280" fill="url(#glowML)"/>

	<g fill="#5b8cc7">
		<circle cx="110" cy="180" r="2.0" opacity="0.09"/>
		<circle cx="300" cy="110" r="1.5" opacity="0.07"/>
		<circle cx="520" cy="230" r="2.2" opacity="0.08"/>
		<circle cx="640" cy="360" r="1.6" opacity="0.07"/>
		<circle cx="180" cy="420" r="1.8" opacity="0.06"/>
		<circle cx="420" cy="520" r="2.4" opacity="0.06"/>
		<circle cx="90"  cy="700" r="1.5" opacity="0.05"/>
		<circle cx="580" cy="780" r="2.0" opacity="0.05"/>
		<circle cx="240" cy="900" r="1.7" opacity="0.045"/>
		<circle cx="480" cy="1040" r="2.2" opacity="0.04"/>
		<circle cx="140" cy="1150" r="1.6" opacity="0.035"/>
		<circle cx="620" cy="1200" r="1.9" opacity="0.03"/>
	</g>
</svg>
