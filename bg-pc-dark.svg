<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
	<!-- 电脑端壁纸（横版 16:9）：深蓝紫夜空 + 星星 + 左下角一片柔和光晕 -->
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#232946"/>
			<stop offset="55%" stop-color="#1b2138"/>
			<stop offset="100%" stop-color="#12162a"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.18" cy="0.85" r="0.6">
			<stop offset="0%" stop-color="#ffd700" stop-opacity="0.22"/>
			<stop offset="60%" stop-color="#ffd700" stop-opacity="0.05"/>
			<stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow2" cx="0.82" cy="0.15" r="0.5">
			<stop offset="0%" stop-color="#9ec9f5" stop-opacity="0.20"/>
			<stop offset="100%" stop-color="#9ec9f5" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1920" height="1080" fill="url(#sky)"/>
	<rect width="1920" height="1080" fill="url(#glow)"/>
	<rect width="1920" height="1080" fill="url(#glow2)"/>

	<!-- 星星 -->
	<g fill="#ffffff">
		<circle cx="180" cy="150" r="2.4" opacity="0.75"/>
		<circle cx="420" cy="90"  r="1.6" opacity="0.55"/>
		<circle cx="700" cy="210" r="2.0" opacity="0.65"/>
		<circle cx="980" cy="120" r="1.5" opacity="0.5"/>
		<circle cx="1240" cy="250" r="2.6" opacity="0.7"/>
		<circle cx="1520" cy="140" r="1.8" opacity="0.6"/>
		<circle cx="1780" cy="300" r="2.2" opacity="0.65"/>
		<circle cx="260" cy="420" r="1.4" opacity="0.45"/>
		<circle cx="620" cy="520" r="2.1" opacity="0.5"/>
		<circle cx="1120" cy="470" r="1.7" opacity="0.45"/>
		<circle cx="1660" cy="560" r="2.3" opacity="0.5"/>
		<circle cx="880" cy="700" r="1.6" opacity="0.35"/>
		<circle cx="1400" cy="780" r="1.9" opacity="0.35"/>
		<circle cx="340" cy="880" r="1.5" opacity="0.3"/>
		<circle cx="1040" cy="900" r="2.0" opacity="0.3"/>
	</g>

	<!-- 右下角一点微光月亮 -->
	<circle cx="1620" cy="220" r="46" fill="#fff8e1" opacity="0.10"/>
	<circle cx="1620" cy="220" r="22" fill="#fff8e1" opacity="0.18"/>
</svg>
