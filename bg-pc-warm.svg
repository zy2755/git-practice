<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
	<!-- 电脑端壁纸 · 暖米皮肤（横版 16:9）
	     和雾蓝版结构完全一致，只把冷色换成米/驼色系：
	     底色偏暖白，左下角一团暖棕光晕，右上角一点暗金光晕 -->
	<defs>
		<linearGradient id="skyW" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#fdfaf6"/>
			<stop offset="55%" stop-color="#fbf6ef"/>
			<stop offset="100%" stop-color="#f6eee3"/>
		</linearGradient>
		<radialGradient id="glowW" cx="0.16" cy="0.86" r="0.62">
			<stop offset="0%" stop-color="#b8834a" stop-opacity="0.10"/>
			<stop offset="60%" stop-color="#b8834a" stop-opacity="0.035"/>
			<stop offset="100%" stop-color="#b8834a" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowW2" cx="0.84" cy="0.12" r="0.55">
			<stop offset="0%" stop-color="#a8883c" stop-opacity="0.09"/>
			<stop offset="100%" stop-color="#a8883c" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="1920" height="1080" fill="url(#skyW)"/>
	<rect width="1920" height="1080" fill="url(#glowW)"/>
	<rect width="1920" height="1080" fill="url(#glowW2)"/>

	<!-- 淡色光点：若有若无的颗粒感 -->
	<g fill="#b8834a">
		<circle cx="180" cy="150" r="2.4" opacity="0.10"/>
		<circle cx="420" cy="90"  r="1.6" opacity="0.08"/>
		<circle cx="700" cy="210" r="2.0" opacity="0.09"/>
		<circle cx="980" cy="120" r="1.5" opacity="0.07"/>
		<circle cx="1240" cy="250" r="2.6" opacity="0.09"/>
		<circle cx="1520" cy="140" r="1.8" opacity="0.08"/>
		<circle cx="1780" cy="300" r="2.2" opacity="0.08"/>
		<circle cx="260" cy="420" r="1.4" opacity="0.07"/>
		<circle cx="620" cy="520" r="2.1" opacity="0.07"/>
		<circle cx="1120" cy="470" r="1.7" opacity="0.06"/>
		<circle cx="1660" cy="560" r="2.3" opacity="0.07"/>
		<circle cx="880" cy="700" r="1.6" opacity="0.05"/>
		<circle cx="1400" cy="780" r="1.9" opacity="0.05"/>
		<circle cx="340" cy="880" r="1.5" opacity="0.05"/>
		<circle cx="1040" cy="900" r="2.0" opacity="0.05"/>
	</g>

	<!-- 右上角一轮很淡的暖白月亮 -->
	<circle cx="1620" cy="220" r="46" fill="#fffdf8" opacity="0.60"/>
	<circle cx="1620" cy="220" r="22" fill="#fffdf8" opacity="0.80"/>
</svg>
